# MewCode LLM Provider 配置
# 支持配置多个 Provider，通过 :switch 命令在运行时切换

default_provider: deepseek

providers:
  - name: deepseek
    protocol: anthropic
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/anthropic
    api_key: ${DEEPSEEK_API_KEY}

# 联网搜索 API key（可选，二选一；不配则回退到 Bing HTML 抓取）
# GLM 智谱：https://open.bigmodel.cn     → 设 GLM_SEARCH_API_KEY
# Brave   ：https://brave.com/search/api → 设 BRAVE_SEARCH_API_KEY
search:
  glm_api_key: ${GLM_SEARCH_API_KEY:-}
  brave_api_key: ${BRAVE_SEARCH_API_KEY:-}
